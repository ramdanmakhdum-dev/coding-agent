<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teman AI Ultimate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --accent: #3b82f6; --border: #334155; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0b1120; border-bottom: 1px solid var(--border); }
        .header h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .header-controls { display: flex; gap: 10px; }
        select, .btn-clear { padding: 8px 12px; border-radius: 8px; background: var(--panel); color: white; border: 1px solid var(--border); font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
        .btn-clear { background: #ef4444; border: none; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;}
        .message { max-width: 85%; padding: 12px 18px; border-radius: 16px; line-height: 1.6; word-wrap: break-word; font-size: 15px;}
        .user-msg { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-msg { background: var(--panel); color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border);}
        
        .bot-msg pre { background: #0b1120; padding: 15px; border-radius: 10px; overflow-x: auto; position: relative; border: 1px solid var(--border); margin-top: 10px;}
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #475569; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; opacity: 0.7; transition: 0.2s;}
        .copy-btn:hover { opacity: 1; background: var(--accent); }
        
        .chat-image { max-width: 100%; max-height: 250px; border-radius: 10px; margin-top: 10px; display: block; border: 1px solid var(--border);}

        .input-wrapper { padding: 15px 20px; background: #0b1120; border-top: 1px solid var(--border); }
        .file-preview { font-size: 12px; color: #94a3b8; margin-bottom: 10px; display: none; align-items: center; gap: 10px; background: var(--panel); padding: 5px 10px; border-radius: 6px; width: fit-content;}
        
        .input-box { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 25px; padding: 5px 10px; gap: 10px;}
        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: white; padding: 10px; font-size: 15px; outline: none; }
        
        .action-btn { background: transparent; color: #94a3b8; border: none; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
        .action-btn:hover { background: #334155; color: white; }
        
        .btn-send { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; transition: 0.2s;}
        .btn-send:hover { background: #2563eb; transform: scale(1.05); }
        .btn-send:disabled { background: #475569; cursor: not-allowed; transform: none;}

        .mic-listening { color: #ef4444 !important; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="header">
        <h2>🦅 Teman AI Ultimate</h2>
        <div class="header-controls">
            <select id="ai-model">
                <option value="omni_ai">🤖 Omni AI</option>
                <option value="image_gen">🎨 Bikin Gambar</option>
                <option value="video_script">🎬 Script Video</option>
            </select>
            <button class="btn-clear" onclick="clearChat()"><i class="fa-solid fa-trash"></i></button>
        </div>
    </div>
    
    <div id="chat-box"></div>

    <div class="input-wrapper">
        <div class="file-preview" id="doc-preview">
            <i class="fa-solid fa-file-lines"></i> <span id="doc-name"></span> 
            <button onclick="clearDoc()" style="background:none;border:none;color:#ef4444;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="input-box">
            <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleFile(event, 'image')">
            <button class="action-btn" onclick="document.getElementById('image-input').click()" title="Gambar"><i class="fa-regular fa-image"></i></button>

            <input type="file" id="doc-input" accept=".txt,.md,.py,.pdf" style="display: none;" onchange="handleFile(event, 'doc')">
            <button class="action-btn" onclick="document.getElementById('doc-input').click()" title="Dokumen"><i class="fa-regular fa-file-lines"></i></button>
            
            <input type="text" id="user-input" placeholder="Ketik pesan atau suara..." onkeypress="handleEnter(event)">
            
            <button class="action-btn" id="mic-btn" onclick="toggleVoice()" title="Bicara"><i class="fa-solid fa-microphone"></i></button>
            <button class="btn-send" id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const aiModel = document.getElementById('ai-model');
        
        let selectedImage = null;
        let selectedDoc = null;
        
        if(localStorage.getItem('teman_model')) aiModel.value = localStorage.getItem('teman_model');

        aiModel.addEventListener('change', async () => {
            localStorage.setItem('teman_model', aiModel.value);
            if (aiModel.value === 'image_gen' || aiModel.value === 'video_script') {
                await fetch('/api/clear', { method: 'POST' });
                chatBox.innerHTML = '';
                const modeText = aiModel.options[aiModel.selectedIndex].text;
                appendMessage(`Beralih ke mode <b>${modeText}</b>. Silakan masukkan prompt.`, 'bot-msg', true);
            } else {
                await fetch('/api/clear', { method: 'POST' });
                chatBox.innerHTML = '';
                appendMessage(`Beralih ke mode <b>Omni AI</b>. Silakan mulai percakapan baru.`, 'bot-msg', true);
            }
        });

        function handleFile(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            if (type === 'image') selectedImage = file;
            else {
                selectedDoc = file;
                document.getElementById('doc-preview').style.display = 'flex';
                document.getElementById('doc-name').innerText = file.name;
            }
        }
        function clearDoc() {
            selectedDoc = null;
            document.getElementById('doc-input').value = '';
            document.getElementById('doc-preview').style.display = 'none';
        }

        window.onload = async () => {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                if (data.history.length === 0) appendMessage("Halo! Aku siap bantu. Kirim teks, gambar, dokumen, atau klik mikrofon (Gunakan Chrome/localhost).", 'bot-msg');
                else data.history.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user-msg' : 'bot-msg', msg.role !== 'user'));
            } catch (e) { console.log("Gagal load"); }
        };

        async function clearChat() {
            await fetch('/api/clear', { method: 'POST' });
            chatBox.innerHTML = ''; appendMessage("Memori dibersihkan.", 'bot-msg');
            selectedImage = null; clearDoc();
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message && !selectedImage && !selectedDoc) return;

            appendMessage(message || "Tolong analisis lampiran ini.", 'user-msg', false, selectedImage ? URL.createObjectURL(selectedImage) : null);
            userInput.value = '';
            sendBtn.disabled = true;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message bot-msg"><i class="fa-solid fa-spinner fa-spin"></i> Teman sedang memproses...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append('message', message || "Analisis lampiran ini.");
            formData.append('model_choice', aiModel.value);
            if (selectedImage) formData.append('image', selectedImage);
            if (selectedDoc) formData.append('document', selectedDoc);

            try {
                const response = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById(loadingId).remove();
                
                selectedImage = null; document.getElementById('image-input').value = '';
                clearDoc();

                if (data.error) appendMessage("Error: " + data.error, 'bot-msg');
                else {
                    appendMessage(data.reply, 'bot-msg', true);
                    speakText(data.reply);
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Gagal terhubung ke server.", 'bot-msg');
            } finally { sendBtn.disabled = false; }
        }

        function appendMessage(text, className, isMarkdown = false, imageUrl = null) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            
            if (isMarkdown) {
                div.innerHTML = marked.parse(text);
                div.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                    const pre = block.parentElement;
                    
                    // HANYA TOMBOL COPY (TOMBOL RUN SUDAH DIHAPUS)
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn'; copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(block.innerText);
                        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!'; setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
                    };
                    pre.appendChild(copyBtn);
                });
            } else {
                div.textContent = text;
            }

            if (imageUrl) {
                const img = document.createElement('img'); img.src = imageUrl; img.className = 'chat-image';
                div.appendChild(img);
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- FITUR SUARA ---
        let isListening = false;
        const micBtn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.interimResults = false;
            recognition.onstart = () => { isListening = true; micBtn.classList.add('mic-listening'); };
            recognition.onend = () => { isListening = false; micBtn.classList.remove('mic-listening'); };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };
            recognition.onerror = (event) => {
                alert("Mikrofon gagal diakses: " + event.error + "\n\nCatatan: Gunakan Chrome atau pastikan di HTTPS/localhost.");
                isListening = false; micBtn.classList.remove('mic-listening');
            };
        }

        function toggleVoice() {
            if (!recognition) return alert("Browser tidak mendukung fitur suara. Gunakan Google Chrome.");
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel(); 
            const cleanText = text.replace(/```[\s\S]*?```/g, ' (Kode program ditampilkan di layar) ').replace(/[*#_]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
